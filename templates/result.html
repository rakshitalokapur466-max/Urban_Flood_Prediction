    <!-- Interactive Direct Alert Dispatch Form -->
    <div style="background: rgba(14, 14, 26, 0.9); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 1.4rem; margin-bottom: 1.5rem;">
        <h4 style="font-size: 1rem; font-weight: 700; color: #ffffff; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 8px;">
            <span>📨</span> Send Alert Message to Specific User / Alternate Email
        </h4>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
            Dispatch an emergency flood warning report directly to your personal email address or municipal responders.
        </p>

        <form id="directAlertForm" onsubmit="handleSendAlert(event)" style="display: flex; gap: 10px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 260px;">
                <input 
                    type="email" 
                    id="directAlertEmail" 
                    class="form-control" 
                    placeholder="Enter recipient email (e.g., resident@gmail.com)..." 
                    value="{{ session.get('user_email', '') }}" 
                    required
                    style="padding: 0.75rem 1rem; font-size: 0.92rem;"
                >
            </div>
            <button type="submit" id="btnSendAlert" class="btn btn-accent" style="padding: 0.75rem 1.6rem; font-size: 0.92rem;">
                <span>⚡ Send Alert Message Now</span>
            </button>
        </form>
        <div id="directAlertFeedback" style="display: none; margin-top: 1rem;" class="alert"></div>
    </div>
</div>
{% endif %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/map.js') }}"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const lat = parseFloat("{{ pred.latitude }}");
        const lon = parseFloat("{{ pred.longitude }}");
        const locationName = "{{ pred.location_name }}";
        const riskLevel = "{{ pred.risk_level }}";
        const rainfall = parseFloat("{{ pred.rainfall }}");
        const prob = parseFloat("{{ pred.probability }}");
        const basinDesc = "{{ zone_data.basin_description if zone_data else '' }}";

        renderSingleLocationMap(lat, lon, locationName, riskLevel, rainfall, prob, basinDesc);
    });

    async function handleSendAlert(e) {
        e.preventDefault();
        const emailInput = document.getElementById("directAlertEmail");
        const btn = document.getElementById("btnSendAlert");
        const feedback = document.getElementById("directAlertFeedback");
        const badge = document.getElementById("alertStatusBadge");

        const email = emailInput ? emailInput.value.trim() : "";
        if (!email) return;

        btn.disabled = true;
        btn.innerHTML = `<span>⏳ Transmitting Alert...</span>`;
        feedback.style.display = "none";

        try {
            const resp = await fetch("/api/alerts/send", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    prediction_id: Number("{{ pred.id }}"),
                    email: email
                })
            });

            const result = await resp.json();
            feedback.style.display = "block";
            if (result.success && result.email_sent) {
                feedback.className = "alert alert-success";
                feedback.innerHTML = `✅ <strong>Live Email Delivered!</strong> The flood warning has been physically sent to <strong>${result.recipient}</strong> via SMTP. Please check your inbox or spam folder.`;
                if (badge && result.status) {
                    badge.innerText = result.status;
                }
            } else if (result.success && !result.email_sent) {
                feedback.className = "alert alert-warning";
                feedback.innerHTML = `
                    <div style="line-height: 1.5;">
                        <strong style="color: #f59e0b;">⚠️ Notice: Alert Saved In-App, but physical email was NOT sent to your inbox.</strong><br/>
                        <span>Reason: <strong>Sender SMTP credentials (<code>MAIL_USERNAME</code> and <code>MAIL_PASSWORD</code>) are not configured in your <code>.env</code> file.</strong></span><br/>
                        <span style="font-size: 0.85rem; margin-top: 5px; display: inline-block;">
                            👉 To receive actual emails in your Gmail inbox, open <code>.env</code> in your project, enter your Gmail and 16-character App Password, and restart the app.
                        </span>
                    </div>
                `;
                if (badge && result.status) {
                    badge.innerText = result.status;
                }
            } else {
                feedback.className = "alert alert-danger";
                feedback.innerText = result.error || "Failed to transmit alert message.";
            }
        } catch (err) {
            feedback.style.display = "block";
            feedback.className = "alert alert-danger";
            feedback.innerText = "Network error encountered while communicating with alert service.";
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<span>⚡ Send Alert Message Now</span>`;
        }
    }
</script>
{% endblock %}
